name: Build Stepwright

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Lifted to the job so the signing step can ask whether a certificate exists.
    # A step condition cannot read the secrets context directly.
    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Stepwright/Stepwright.csproj

      - name: Build
        run: dotnet build src/Stepwright/Stepwright.csproj -c Release --no-restore

      - name: Check the document writer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 900, 520
          $canvas = [System.Drawing.Graphics]::FromImage($bitmap)
          $canvas.Clear([System.Drawing.Color]::LightSteelBlue)
          $canvas.FillEllipse([System.Drawing.Brushes]::OrangeRed, 400, 200, 90, 90)
          $picture = Join-Path $env:RUNNER_TEMP "probe.jpg"
          $bitmap.Save($picture, [System.Drawing.Imaging.ImageFormat]::Jpeg)

          $out = Join-Path $env:RUNNER_TEMP "probe.pdf"
          dotnet run --project tools/PdfProbe/PdfProbe.csproj -c Release -- `
            $out C:\Windows\Fonts\segoeui.ttf C:\Windows\Fonts\segoeuib.ttf $picture $picture

          if (-not (Test-Path $out)) { throw "no document was produced" }
          $size = (Get-Item $out).Length
          Write-Host "document size $size bytes"

          # A real embedded font pushes this well past a hundred kilobytes. Anything smaller
          # means the font was silently skipped.
          if ($size -lt 120000) { throw "the document is too small, the font was not embedded" }

          $bytes = [System.IO.File]::ReadAllBytes($out)
          $head = [System.Text.Encoding]::ASCII.GetString($bytes[0..4])
          $tail = [System.Text.Encoding]::ASCII.GetString($bytes[($bytes.Length - 6)..($bytes.Length - 1)])
          if ($head -ne "%PDF-") { throw "wrong file header: $head" }
          if ($tail -notmatch "%%EOF") { throw "the file is not terminated: $tail" }
          Write-Host "document header and trailer are correct"

      - name: Publish the standalone build
        run: >
          dotnet publish src/Stepwright/Stepwright.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/standalone

      - name: Publish the small build
        run: >
          dotnet publish src/Stepwright/Stepwright.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/compact

      - name: Name the outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item publish/standalone/Stepwright.exe artifacts/Stepwright.exe
          Copy-Item publish/compact/Stepwright.exe artifacts/Stepwright.small.exe

      # Runs only once a certificate has been added to the repository secrets. Without one
      # the builds are still produced, they are simply unsigned.
      - name: Sign the builds
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))

          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName)[-1].FullName
          Write-Host "using $signtool"

          foreach ($file in Get-ChildItem artifacts/*.exe) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:SIGNING_CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($file.Name)" }
          }

          Remove-Item $pfx -Force
          foreach ($file in Get-ChildItem artifacts/*.exe) {
            & $signtool verify /pa /v $file.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Stepwright
          path: artifacts/*.exe
          retention-days: 30

      - name: Attach the builds to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
