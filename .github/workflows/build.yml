name: Build Stepwright

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Lifted to the job so the signing step can ask whether a certificate exists.
    # A step condition cannot read the secrets context directly.
    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Stepwright/Stepwright.csproj

      - name: Build
        run: dotnet build src/Stepwright/Stepwright.csproj -c Release --no-restore

      - name: Check the document writer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 900, 520
          $canvas = [System.Drawing.Graphics]::FromImage($bitmap)
          $canvas.Clear([System.Drawing.Color]::LightSteelBlue)
          $canvas.FillEllipse([System.Drawing.Brushes]::OrangeRed, 400, 200, 90, 90)
          $picture = Join-Path $env:RUNNER_TEMP "probe.jpg"
          $bitmap.Save($picture, [System.Drawing.Imaging.ImageFormat]::Jpeg)

          $out = Join-Path $env:RUNNER_TEMP "probe.pdf"
          dotnet run --project tools/PdfProbe/PdfProbe.csproj -c Release -- `
            $out C:\Windows\Fonts\segoeui.ttf C:\Windows\Fonts\segoeuib.ttf $picture $picture

          if (-not (Test-Path $out)) { throw "no document was produced" }
          $size = (Get-Item $out).Length
          Write-Host "document size $size bytes"

          # A real embedded font pushes this well past a hundred kilobytes. Anything smaller
          # means the font was silently skipped.
          if ($size -lt 120000) { throw "the document is too small, the font was not embedded" }

          $bytes = [System.IO.File]::ReadAllBytes($out)
          $head = [System.Text.Encoding]::ASCII.GetString($bytes[0..4])
          $tail = [System.Text.Encoding]::ASCII.GetString($bytes[($bytes.Length - 6)..($bytes.Length - 1)])
          if ($head -ne "%PDF-") { throw "wrong file header: $head" }
          if ($tail -notmatch "%%EOF") { throw "the file is not terminated: $tail" }
          Write-Host "document header and trailer are correct"

      - name: Check the animation writer
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "probe.gif"
          dotnet run --project tools/GifProbe/GifProbe.csproj -c Release -- $out

          if (-not (Test-Path $out)) { throw "no animation was produced" }
          $bytes = [System.IO.File]::ReadAllBytes($out)
          Write-Host "animation size $($bytes.Length) bytes"

          $head = [System.Text.Encoding]::ASCII.GetString($bytes[0..5])
          if ($head -ne "GIF89a") { throw "wrong file header: $head" }
          if ($bytes[$bytes.Length - 1] -ne 0x3B) { throw "the file is not terminated" }

          # Every viewer needs the looping marker, so its absence is a real failure. It sits
          # after the colour table, which is 768 bytes on its own, so look well past that.
          $text = [System.Text.Encoding]::ASCII.GetString($bytes[0..1600])
          if ($text -notmatch "NETSCAPE2.0") { throw "the looping marker is missing" }
          Write-Host "animation header, looping marker and trailer are correct"

      - name: Publish the standalone build
        run: >
          dotnet publish src/Stepwright/Stepwright.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/standalone

      - name: Publish the small build
        run: >
          dotnet publish src/Stepwright/Stepwright.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/compact

      - name: Name the outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item publish/standalone/Stepwright.exe artifacts/Stepwright.exe
          Copy-Item publish/compact/Stepwright.exe artifacts/Stepwright.small.exe

      # Microsoft issues the certificate and keeps the key, so there is no file to look
      # after. Runs only once the four Azure values are in the repository secrets.
      - name: Sign with Azure Trusted Signing
        if: env.AZURE_TENANT_ID != '' && env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The other route: a certificate file you hold yourself. Without one the builds are
      # still produced, they are simply unsigned.
      - name: Sign the builds
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))

          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName)[-1].FullName
          Write-Host "using $signtool"

          foreach ($file in Get-ChildItem artifacts/*.exe) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:SIGNING_CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($file.Name)" }
          }

          Remove-Item $pfx -Force
          foreach ($file in Get-ChildItem artifacts/*.exe) {
            & $signtool verify /pa /v $file.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Stepwright
          path: artifacts/*.exe
          retention-days: 30

      - name: Attach the builds to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true

  mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: mac/Stepwright/build.sh "$RUNNER_TEMP/macbuild"

      - name: Check the bundle
        run: |
          APP="$RUNNER_TEMP/macbuild/Stepwright.app"
          test -x "$APP/Contents/MacOS/Stepwright" || { echo "no executable in the bundle"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "no plist in the bundle"; exit 1; }
          file "$APP/Contents/MacOS/Stepwright"
          du -sh "$APP"

      - name: Package it
        run: |
          cd "$RUNNER_TEMP/macbuild"
          ditto -c -k --keepParent Stepwright.app "$GITHUB_WORKSPACE/Stepwright-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Stepwright-mac
          path: Stepwright-mac.zip
          retention-days: 30

      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Stepwright-mac.zip
